<section class="why_choose_us background">
  <div class="container">
    <div class="about-sub-heading">
      <h2>
        {{ module.heading_2 }}
      </h2>
    </div>
    <div class="why_choose_us_row">
      {% for item in module.card_group %}
      <div class="why_choose_us_col">
        <div class="why_choose_us_card">
          <p class="card-heading">
            {{ item.card_heading }}
          </p>
          <div class="card-para">
            {{ item.card_para }}
          </div>

          <!--             <div class="content read-more-slide">{{ module.content }}</div>

            <button class="moreless-button">{{ item.read_more_button }}</button> -->
        </div>
      </div>
      {% endfor %}
    </div>

  </div>
</section>
