<div class="cm-equipment" style="background-image:url({{ module.background_image.src }})">
  <div class="page-center">
    <div class="cm-content">
      <h1>{{ module.banner_heading }}</h1>
    </div>
  </div>
  <div class="banner_scroll {{ module.bookmark_icon }}">
    {% if module.bookmark_icon=="style1" %}
    <a href="#{{ module.bookmark_id }}" class="scroll-down-container">
      <span class="scroll-down et-pb-icon">;</span>
    </a>
    {% endif %}
    {% if module.bookmark_icon=="style2" %}
    <a href="#{{ module.bookmark_id }}" class="scroll-down-container">
      <span class="scroll-down et-pb-icon">"</span>
    </a>
    {% endif %}
  </div>
</div>
