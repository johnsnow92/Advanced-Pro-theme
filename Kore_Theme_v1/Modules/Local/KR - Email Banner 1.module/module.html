<!-- Email: Code for background image for outlook and windows 10 mail view  -->
<table class="" cellpadding="0" cellspacing="0" border="0" style="width: 100%;" align="center" width="100%">
  <tr>
    <td align="center">
      <table border="0" cellspacing="0" cellpadding="0" width="100%">
        <tr>
          <td class="" valign="top" height="260" background="{{ module.background_image.src }}" style="height:260px; background-image:url('{{ module.background_image.src }}'); background-repeat:no-repeat; background-position:center;background-size: cover;">
            <!--[if gte mso 9]>
<v:image xmlns:v="urn:schemas-microsoft-com:vml" id="theImage" style="behavior: url(#default#VML); display: inline-block; position: absolute; width: 600px; height: 260px; top: 0; left: 0; border: 0; z-index: 1;" src="{{ module.background_image.src }}" />                             
<v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="display: inline-block; position: absolute; width: 600px; height: 260px; top: 0; left: 0; border: 0; z-index: 2;">
<v:fill opacity="0%" style="z-index: 1;"/> 
<div>                       
<![endif]--> 
            <!-- Containing Table -->
            <div style="margin:0px auto;max-width:600px;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="" align="center" valign="middle" height="260" style="height:260px">

                  <!-- Headline -->
                  <table width="100%" align="center" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" valign="middle" style="padding: 0 40px;">

                        <!--[if mso 16]> <v:image src="{{ module.image.src }}" style="position:relative;top:20;left:375;width:150;height:68"> </v:image><![endif]-->
                        <h1 style="font-family: Arial, sans-serif;color: #fff; font-size: 30px; margin: 0 0 12px; line-height: 32px">{{ module.main_heading }}</h1>
                        <p style="color: #fff; font-size: 16px;line-height: 1.4;">
                          {{ module.sub_heading }}
                        </p>
                      </td>
                      <td></td>
                    </tr>
                  </table>
                  <!-- Headline END -->
                </td>
              </tr>
            </table>
            <!-- Containing Table END-->
            </div>
              
            <!--[if gte mso 9]>   
</div></v:fill></v:rect><![endif]--> 
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
