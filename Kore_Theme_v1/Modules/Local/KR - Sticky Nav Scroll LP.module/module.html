{% if module.section_show_hide %}
<!-- HTML to show when checked -->
<div class="kore-lp-sticky-nav-scroll">

  <div class="dropdown">
    <button class="btn btn-default dropdown-toggle" type="button" id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M16 132h416c8.837 0 16-7.163 16-16V76c0-8.837-7.163-16-16-16H16C7.163 60 0 67.163 0 76v40c0 8.837 7.163 16 16 16zm0 160h416c8.837 0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837 0-16 7.163-16 16v40c0 8.837 7.163 16 16 16zm0 160h416c8.837 0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837 0-16 7.163-16 16v40c0 8.837 7.163 16 16 16z"/></svg> {{ module.menu_text }}

    </button>
    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
      {% for item in module.menu %}
      <li><a href="#{{ item.target|replace('#', '')|lower }}">{{ item.text }}</a></li>
      {% endfor %}
    </ul>
  </div>

</div>
{% endif %}
